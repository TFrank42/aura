[package]
name = "aura-inference"
version = "0.1.0"
edition = "2021"
description = "AURA on-device inference engine — GGUF parser, quantized tensor ops, ARM NEON optimized"
license = "MIT"

[lib]
name = "aura_inference"
path = "src/lib.rs"

[[bin]]
name = "aura-probe"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[dependencies]
memmap2 = "0.9.10"
